# Settings for segment/model_report.py
# Run from the repo root after training:  python segment/model_report.py

# Name used in the output folder bin/Run_<timestamp>_<model_name>.
# Leave empty to use the training run name (the folder that contains weights/best.pt).
model_name: "yolov5n_seg_640_nomosaic"

environment:
  # "1" makes every CUDA call synchronous and inflates the timing numbers. Keep "0" for timing.
  cuda_launch_blocking: "0"

model:
  weights: "/home/aiviz05/Projects/yolo_final/yolov5/BISMART/yolov5n_seg_640_nomosaic/weights/best.pt"  # training PC
  device: "0"        # "0" for the first GPU, "cpu" for CPU
  require_cuda: true # inspection runs on GPU: stop instead of silently running on CPU
  imgsz: 640
  half: false        # true = FP16 for metrics and timing (CUDA only)

dataset:
  data_yaml: "/media/aiviz05/Dati/DATA/BISMART/products_subsampled_jpg/bismart.yaml"  # training PC
  split: "val"
  save_path: ""      # set by the script
  test_output: ""    # set by the script

map:                 # segment/val.py settings (standard mAP evaluation)
  conf_thres: 0.001
  iou_thres: 0.6
  max_det: 300        # validation always runs with batch size 1
  workers: 8

pixel:               # IoU / precision / recall at a fixed confidence, and timing
  conf_thres: 0.7    # same value for every report (all results so far use 0.7)
  iou_nms: 0.45
  match_iou: 0.5
  max_det: 1000
  # How predicted masks are built (IoU/Precision/Recall, timing, pred_plots and the val.py mask mAP):
  #   upsample_then_crop: upsample to 640 first, then cut at the box -> smoother edges and corners
  #   crop_then_upsample: cut at the box on the 160x160 grid, then upsample (old behaviour, YOLOv5 predict.py)
  mask_mode: upsample_then_crop
  # A pixel belongs to a mask when its mask probability is above this value (YOLOv5 default 0.5).
  # Higher = smaller masks (precision up, recall down). Used for the val.py mask mAP too. Tune with
  # segment/mask_threshold_sweep.py.
  mask_thres: 0.55 # best Mask mAP50-95 for n and s in the 2026-11-09 sweep (0.5 = YOLOv5 default)

timing:
  warmup_images: 10  # images run before timing starts, not recorded

onnx:                # segment/model_report_onnx.py only
  weights: ""        # existing .onnx file; empty = export model.weights to ONNX next to it first
  opset: 12          # v7.0 export default
  simplify: false    # true needs the onnxsim package
  half: false        # true = FP16 ONNX (needs a GPU device for export)
  require_cuda: true # stop if ONNX Runtime falls back to CPU when a GPU is requested

plots:               # segment/model_report.py prediction images at full resolution (test/pred_plots/)
  num_images: 20     # first N images of the split; 0 = no plots
  num_worst: 20      # worst N images by FP + FN, then lowest IoU (test/worst_plots); 0 = none
  alpha: 0.4         # fill opacity of predicted masks
  draw_gt: true      # draw label outlines for comparison
  gt_color: [0, 255, 0]  # label outline color, BGR
  show_conf: false   # write class and confidence next to each prediction

trt_compare:         # segment/trt_compare.py: Python reference json for the C++ TensorRT YoloV5Seg (--python-output)
  weights: "results/v18_yolov5_results_of_models/v18_yolov5s_seg_640/weights/best.pt"
  images: "/media/mostafahaggag/D/Data/bismart/products_subsampled_jpg/images/val"
  imgsz: 640         # ONNX / TensorRT input size (square)
  num_images: 0      # 0 = all

onnx_infer:          # segment/onnx_infer.py: stand-alone ONNX Runtime inference (numpy + OpenCV pre/post only)
  weights: "results/v18_yolov5_results_of_models/v18_yolov5s_seg_640/weights/best.onnx"  # from export.py
  images: "/media/mostafahaggag/D/Data/bismart/products_subsampled_jpg/images/val"  # folder of images
  num_images: 0      # 0 = all
  device: "0"        # "0" = CUDAExecutionProvider, "cpu" = CPU
  require_cuda: true # stop if ONNX Runtime falls back to CPU
  conf_thres: 0.7    # keep the same values as pixel.* for comparable results
  iou_nms: 0.45
  max_det: 1000
  mask_thres: 0.55 # best Mask mAP50-95 for n and s in the 2026-11-09 sweep (0.5 = YOLOv5 default)
  warmup: 10         # untimed runs before timing
  save_images: true  # predictions drawn at full resolution in images/
  alpha: 0.4
  show_conf: false

compare_plots:       # segment/compare_plots.py: GT (left) | prediction (right) at full resolution, every val image
                     # (uses model, dataset.split, pixel and plots settings above)
  weights: "results/v18_yolov5_results_of_models/v18_yolov5s_seg_640/weights/best.pt"  # empty = model.weights
  data_yaml: "/media/mostafahaggag/D/Data/bismart/products_subsampled_jpg/bismart_laptop.yaml"  # empty = dataset.data_yaml
  num_images: 0      # 0 = all images of the split, N = first N
  gap: 20            # white gap between the two panels, pixels
  gt_outline_on_pred: false # true = also draw the label outlines (green) on the prediction panel

mask_sweep:          # segment/mask_threshold_sweep.py: full report (map, pixel, plots settings above)
                     # once per model and mask threshold, one row each in mask_sweep.csv / .tsv
  models:            # best.pt files to test; empty = model.weights
    - results/v18_yolov5_results_of_models/v18_yolov5n_seg_640_nomosaic/weights/best.pt
    - results/v18_yolov5_results_of_models/v18_yolov5s_seg_640/weights/best.pt
  data_yaml: "/media/mostafahaggag/D/Data/bismart/products_subsampled_jpg/bismart_laptop.yaml"  # empty = dataset.data_yaml
  thresholds: [0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]
  plots: false       # true = pred_plots / worst_plots for every threshold (slow); false = no plots

report:
  summary_csv: "bin/summary.csv"  # one row per report run (Torch and ONNX); empty = do not write

experiments:         # segment/run_experiments.py: train these one after another, then report each best.pt
  data_yaml: "/media/aiviz05/Dati/DATA/BISMART/products_subsampled_jpg/bismart.yaml"  # training PC; empty = dataset.data_yaml
  project: "BISMART" # train.py --project (also the W&B project name)
  epochs: 100
  batch_size: 16
  oom_batch_sizes: [8, 4, 2, 1]  # retried in this order after CUDA out of memory
  device: "0"
  workers: 8
  skip_done: true    # skip training when <project>/<name>/weights/best.pt already exists
  report_torch: true
  report_onnx: false
  runs:              # per run: name, weights, imgsz, hyp ("" = default), optional cfg (model yaml), epochs, batch_size, extra_args
    # Only the runs still to train. Finished runs (n/s 640, nomosaic, maskratio1, nooverlap, 960, rect) were removed;
    # their results are in results/final_results. Compare each new run with v18_yolov5s_seg_640_nomosaic /
    # v18_yolov5n_seg_640_nomosaic (same hyp.bismart settings, 640, no mosaic).
    # proto2x: mask prototypes at stride 2 (320x320 at 640) instead of 4. hyp.bismart.proto2x.yaml = hyp.bismart.yaml
    # + mask_max 64 (mask loss limit, the first proto2x runs ran out of GPU memory). m proto2x uses batch 8: batch 16
    # needs about 9.5 GB in the laptop memory test.
    - {name: v18_yolov5s_seg_640_nomosaic_proto2x, weights: yolov5s-seg.pt, cfg: models/segment/yolov5s-seg-proto2x.yaml, imgsz: 640, hyp: data/hyps/hyp.bismart.proto2x.yaml, extra_args: "--mask-ratio 2"}
    - {name: v18_yolov5m_seg_640_nomosaic, weights: yolov5m-seg.pt, imgsz: 640, hyp: data/hyps/hyp.bismart.yaml}
    - {name: v18_yolov5m_seg_640_nomosaic_proto2x, weights: yolov5m-seg.pt, cfg: models/segment/yolov5m-seg-proto2x.yaml, imgsz: 640, hyp: data/hyps/hyp.bismart.proto2x.yaml, batch_size: 8, extra_args: "--mask-ratio 2"}
    - {name: v18_yolov5n_seg_640_nomosaic_proto2x, weights: yolov5n-seg.pt, cfg: models/segment/yolov5n-seg-proto2x.yaml, imgsz: 640, hyp: data/hyps/hyp.bismart.proto2x.yaml, extra_args: "--mask-ratio 2"}
