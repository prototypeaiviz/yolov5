# Settings for segment/model_report.py
# Run from the repo root after training:  python segment/model_report.py

# Name used in the output folder bin/Run_<timestamp>_<model_name>.
# Leave empty to use the training run name (the folder that contains weights/best.pt).
model_name: ""

environment:
  # "1" makes every CUDA call synchronous and inflates the timing numbers. Keep "0" for timing.
  cuda_launch_blocking: "0"

model:
  weights: "BISMART/v18_yolov5n_seg_640/weights/best.pt"
  device: "0"        # "0" for the first GPU, "cpu" for CPU
  require_cuda: true # inspection runs on GPU: stop instead of silently running on CPU
  imgsz: 640
  half: false        # true = FP16 for metrics and timing (CUDA only)

dataset:
  data_yaml: "/media/aiviz05/Dati/DATA/BISMART/SUBSAMPLED_DATA_V18/bismart_v18.yaml"
  split: "val"
  save_path: ""      # set by the script
  test_output: ""    # set by the script

map:                 # segment/val.py settings (standard mAP evaluation)
  conf_thres: 0.001
  iou_thres: 0.6
  max_det: 300
  batch_size: 16
  workers: 8

pixel:               # IoU / precision / recall at a fixed confidence, and timing
  conf_thres: 0.25
  iou_nms: 0.45
  match_iou: 0.5
  max_det: 1000
  # How predicted masks are built (IoU/Precision/Recall, timing, pred_plots; val.py mAP is not affected):
  #   upsample_then_crop: upsample to 640 first, then cut at the box -> smoother edges and corners
  #   crop_then_upsample: cut at the box on the 160x160 grid, then upsample (old behaviour, YOLOv5 predict.py)
  mask_mode: upsample_then_crop

timing:
  warmup_images: 10  # images run before timing starts, not recorded

onnx:                # segment/model_report_onnx.py only
  weights: ""        # existing .onnx file; empty = export model.weights to ONNX next to it first
  opset: 12          # v7.0 export default
  simplify: false    # true needs the onnxsim package
  half: false        # true = FP16 ONNX (needs a GPU device for export)
  require_cuda: true # stop if ONNX Runtime falls back to CPU when a GPU is requested

plots:               # segment/model_report.py prediction images at full resolution (test/pred_plots/)
  num_images: 20     # first N images of the split; 0 = no plots
  num_worst: 20      # worst N images by FP + FN, then lowest IoU (test/worst_plots); 0 = none
  alpha: 0.4         # fill opacity of predicted masks
  draw_gt: true      # draw label outlines for comparison
  gt_color: [0, 255, 0]  # label outline color, BGR
  show_conf: false   # write class and confidence next to each prediction

report:
  summary_csv: "bin/summary.csv"  # one row per report run (Torch and ONNX); empty = do not write

experiments:         # segment/run_experiments.py: train these one after another, then report each best.pt
  data_yaml: ""      # empty = dataset.data_yaml (same data for training and reports)
  project: "BISMART" # train.py --project (also the W&B project name)
  epochs: 100
  batch_size: 16
  oom_batch_sizes: [8, 4]  # retried in this order after CUDA out of memory
  device: "0"
  workers: 8
  skip_done: true    # skip training when <project>/<name>/weights/best.pt already exists
  report_torch: true
  report_onnx: false
  runs:              # per run: name, weights, imgsz, hyp ("" = default), optional epochs, batch_size, extra_args
    - {name: v18_yolov5n_seg_640, weights: yolov5n-seg.pt, imgsz: 640, hyp: ""}
    - {name: v18_yolov5n_seg_640_nomosaic, weights: yolov5n-seg.pt, imgsz: 640, hyp: data/hyps/hyp.bismart.yaml}
    - {name: v18_yolov5s_seg_640, weights: yolov5s-seg.pt, imgsz: 640, hyp: ""}
    - {name: v18_yolov5s_seg_640_nomosaic, weights: yolov5s-seg.pt, imgsz: 640, hyp: data/hyps/hyp.bismart.yaml}
    - {name: v18_yolov5n_seg_640_nomosaic_maskratio1, weights: yolov5n-seg.pt, imgsz: 640, hyp: data/hyps/hyp.bismart.yaml, extra_args: "--mask-ratio 1"}
    - {name: v18_yolov5n_seg_1280_nomosaic, weights: yolov5n-seg.pt, imgsz: 1280, hyp: data/hyps/hyp.bismart.yaml}
