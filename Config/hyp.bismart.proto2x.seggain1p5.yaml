# Advantech India v17, Product only, one class.
# Identical to data/hyps/hyp.bismart.proto2x.yaml except seg_gain: 1.5.
# seg_gain multiplies the existing mask-loss weight; box/objectness losses are unchanged.
# Use linear SGD via experiments.runs in Config/main_config.yaml.
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
seg_gain: 1.5
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
mask_max: 64
