# Advantech India v17: s-proto2x, 640, batch 16, 100 epochs, COCO initialization.
# Same loss, mask sampling and augmentation as data/hyps/hyp.bismart.proto2x.yaml.
# Optimizer is selected by experiments.runs[].extra_args in main_config.yaml.
# This is a candidate AdamW recipe, not a proven improvement over SGD.
lr0: 0.001
lrf: 0.01  # cosine schedule ends near lr0 * lrf = 0.00001
momentum: 0.9  # AdamW beta1 in utils/torch_utils.py:smart_optimizer
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8  # used by SGD only; AdamW has no momentum parameter group key
warmup_bias_lr: 0.0  # warm biases up from zero; do not inherit SGD's 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
mask_max: 64
